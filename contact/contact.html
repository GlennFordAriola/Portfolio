<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>
    <img class="image-gradient" src="../images/gradient.png" alt="gradient">
    <div class="layer-blur"></div>

    <div class="container">
        <div id="header-placeholder"></div>

        <main>

            <section class="contact-hero">
                <span data-aos="fade-up" data-aos-duration="700" data-aos-easing="ease-out-cubic" data-aos-delay="100"
                    class="eyebrow">Contact Me</span>
                <h1 data-aos="fade-up" data-aos-duration="800" data-aos-easing="ease-out-cubic" data-aos-delay="250">
                    Let's <span class="highlight">work together.</span></h1>
                <p data-aos="fade-up" data-aos-duration="800" data-aos-easing="ease-out-cubic" data-aos-delay="400"
                    class="contact-lead">
                    Have a project in mind or just want to say hi? Fill out the form and I'll get back to you.
                </p>
            </section>

            <section class="contact-body">

                <form data-aos="fade-right" data-aos-duration="900" data-aos-easing="ease-out-cubic"
                    data-aos-delay="200" action="https://formspree.io/f/xdargabo" method="POST" class="contact-form"
                    id="contactForm"">
                    <div class=" form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
    </div>
    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell me more..." required></textarea>
    </div>
    <button type="submit" class="btn-submit">Send Message</button>
    </form>

    <div data-aos="fade-left" data-aos-duration="900" data-aos-easing="ease-out-cubic" data-aos-delay="350"
        class="contact-info">
        <div class="info-block">
            <span class="info-label">Email</span>
            <a href="mailto:gfordariola@gmail.com" class="info-value">gfordariola@gmail.com</a>
        </div>
        <div class="info-block">
            <span class="info-label">Location</span>
            <span class="info-value">Philippines</span>
        </div>
        <div class="info-block">
            <span class="info-label">Availability</span>
            <span class="info-value">Open to opportunities</span>
        </div>
        <div class="socials">
            <span class="info-label">Socials</span>
            <div class="social-links">
                <a href="https://www.instagram.com/glenn_ford4/" target="_blank" class="social-link">Instagram</a>
                <a href="https://www.facebook.com/glennford.ariola/" target="_blank" class="social-link">Facebook</a>
            </div>
        </div>
    </div>

    </section>

    </main>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        fetch('../header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                AOS.init({
                    once: true,
                    mirror: false,
                });
            });

        const form = document.getElementById('contactForm');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = form.querySelector('.btn-submit');

            btn.textContent = 'Sending...';
            btn.disabled = true;

            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                btn.textContent = 'Message Sent!';
                form.reset();
            } else {
                btn.textContent = 'Try Again';
                btn.disabled = false;
                alert('Something went wrong.');
            }
        });
    </script>
</body>

</html>
